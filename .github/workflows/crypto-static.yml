name: Crypto Static Guards

# Client-side anti-regression checks for E2E X5 call signaling and key handling.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  crypto-static:
    name: Crypto Static Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Forbid plaintext WebRTC signaling emits
        run: |
          set -euo pipefail
          # Call/meeting socket emits must carry sealed envelopes, not raw SDP/ICE.
          if grep -RInE --include='*.{js,jsx,ts,tsx}' \
            "emit\(['\"](call|meeting):(offer|answer|ice|invite|accept|reject|hangup|join|leave|end)['\"].*\b(sdp|candidate)\b" \
            src; then
            echo "::error::Raw SDP/ICE fields must not appear on call:*/meeting:* emits — use X5 envelopes."
            exit 1
          fi
          echo "OK: no plaintext call/meeting signaling emits detected"

      - name: Require sealed call helper usage
        run: |
          set -euo pipefail
          test -f src/utils/callSignalTransport.js
          grep -q "sealForPeer\|emitSealedEnvelope" src/utils/callSignalTransport.js
          test -f src/hooks/useWebRTCCall.js
          grep -q "emitSealedEnvelope\|envelope" src/hooks/useWebRTCCall.js
          test -f src/hooks/useMeetingCall.js
          grep -q "emitSealedEnvelope\|envelope" src/hooks/useMeetingCall.js
          echo "OK: useWebRTCCall and useMeetingCall use sealed envelopes"

      - name: Require sealed DM payload helper
        run: |
          set -euo pipefail
          test -f src/crypto/sealedPayload.js
          grep -q "buildSealedDmBody" src/crypto/sealedPayload.js
          grep -q "FORBIDDEN_PLAINTEXT_KEYS" src/crypto/sealedPayload.js
          echo "OK: sealedPayload.js forbids plaintext chat fields"

      - name: Forbid private key console logging
        run: |
          set -euo pipefail
          if grep -RInE --include='*.{js,jsx,ts,tsx}' \
            "console\.(log|debug|info|warn|error)\([^)]*(secretKey|privateKey|seed)" \
            src; then
            echo "::error::Private key material must never be logged."
            exit 1
          fi
          echo "OK: no private-key console logging detected"

      - name: Forbid logging plaintext message drafts in crypto modules
        run: |
          set -euo pipefail
          if grep -RInE --include='*.{js,jsx,ts,tsx}' \
            "console\.(log|debug|info|warn|error)\([^)]*(plaintext|draft|forRecipient)" \
            src/crypto; then
            echo "::error::Do not log plaintext or envelope material from crypto modules."
            exit 1
          fi
          echo "OK: crypto modules do not log plaintext drafts"

      - name: Run frontend crypto unit tests
        run: npm run test:crypto
